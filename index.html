<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6B3FE4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kho ý tưởng" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<title>Kho ý tưởng</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#F3F1EE; --surface:#FFFFFF; --ink:#191622; --muted:#736E7C; --line:#E8E4DF; --violet:#6B3FE4; --violet-soft:#EEE9FD; --violet-ink:#4B27B0; --shadow:0 1px 2px rgba(25,22,34,.05),0 10px 26px rgba(25,22,34,.06); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  button:focus-visible,input:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
  .wrap{ max-width:1000px; margin:0 auto; padding:20px 16px 60px; }

  header.top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .brand h1{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:26px; letter-spacing:-.025em; margin:0; }
  .brand .dot{ color:var(--violet); }
  .brand .meta{ margin:6px 0 0; color:var(--muted); font-size:12.5px; font-weight:500; display:flex; align-items:center; gap:7px; }
  .brand .meta .dotsep{ width:3px; height:3px; border-radius:50%; background:#CBC6D0; }
  .synced{ color:#1B9C5D; }
  .btn-signout{ font-size:13px; font-weight:600; color:var(--muted); border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:999px; white-space:nowrap; }
  .btn-signout:active{ color:var(--ink); }

  .notice{ background:#FFF7E8; border:1px solid #F0DFB5; border-radius:14px; padding:14px 16px; margin-bottom:16px; font-size:13.5px; color:#6b5a2a; display:none; }
  .notice b{ color:#4a3d16; }

  .quickadd{ background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:14px; margin-bottom:22px; }
  .qa-row{ display:flex; gap:8px; margin-bottom:12px; }
  .qa-paste{ flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; background:var(--ink); color:#fff; font-weight:600; font-size:13.5px; padding:0 15px; border-radius:11px; }
  .qa-paste:active{ background:var(--violet); }
  .qa-input{ flex:1; min-width:0; font-family:inherit; font-size:14.5px; padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:#FBFAF9; }
  .qa-input::placeholder{ color:#ABA5B3; }
  .qa-note{ width:100%; display:block; margin-bottom:13px; }
  .qa-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin:0 0 8px 2px; }
  .qa-cats{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:13px; }
  .qa-chip{ font-size:13px; font-weight:500; padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:#fff; white-space:nowrap; }
  .qa-chip.on{ background:var(--violet); border-color:var(--violet); color:#fff; }
  .qa-save{ width:100%; background:var(--violet); color:#fff; font-weight:600; font-size:15px; padding:13px; border-radius:12px; }
  .qa-save:active{ background:var(--violet-ink); }
  .qa-save:disabled{ opacity:.45; }

  .browse-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; margin:0 0 10px 2px; }
  .fill-all{ text-transform:none; letter-spacing:0; font-size:11.5px; font-weight:600; color:var(--violet-ink); background:var(--violet-soft); border:1px solid #e2d8fb; padding:5px 11px; border-radius:999px; white-space:nowrap; }
  .fill-all:active{ background:#e2d8fb; }
  .fill-all:disabled{ opacity:.6; }
  .catbar{ margin:0 -16px 14px; padding:0 16px; }
  .catlist{ display:grid; grid-auto-flow:column; grid-template-rows:auto auto; grid-auto-columns:max-content; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .catlist::-webkit-scrollbar{ display:none; }
  .cat{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px; font-size:13.5px; font-weight:500; background:var(--surface); border:1px solid var(--line); white-space:nowrap; transition:transform .1s ease; }
  .cat:active{ transform:scale(.96); }
  .cat.on{ background:var(--violet); color:#fff; border-color:var(--violet); }
  .cat .n{ font-size:11px; font-weight:700; color:var(--muted); background:#EBE7E1; padding:0 7px; border-radius:999px; min-width:20px; text-align:center; }
  .cat.on .n{ background:rgba(255,255,255,.24); color:#fff; }

  .content-h h2{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:19px; margin:0 0 11px; display:flex; align-items:baseline; gap:9px; }
  .content-h h2 .sub{ font-family:"Inter"; font-weight:500; font-size:13px; color:var(--muted); }
  .search{ position:relative; margin-bottom:16px; }
  .search svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#ABA5B3; }
  .search input{ width:100%; font-family:inherit; font-size:15px; padding:12px 15px 12px 38px; border:1px solid var(--line); border-radius:13px; background:var(--surface); }
  .search input::placeholder{ color:#ABA5B3; }

  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:13px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:17px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
  .thumb{ position:relative; width:100%; aspect-ratio:3/4; cursor:pointer; overflow:hidden; }
  .thumb .ph{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; color:rgba(255,255,255,.95); }
  .thumb .ph .big{ font-size:32px; }
  .thumb .ph .cap{ font-size:11px; font-weight:500; opacity:.85; }
  .ph.tiktok{ background:radial-gradient(120% 120% at 30% 20%,#2b2b2b,#0c0c0c); }
  .ph.instagram{ background:linear-gradient(150deg,#F9A03F,#DD2A7B 50%,#8134AF); }
  .ph.youtube{ background:linear-gradient(150deg,#F04141,#C21F1F); }
  .ph.facebook{ background:linear-gradient(150deg,#3b82f6,#1877F2 60%,#0d5bcd); }
  .ph.other{ background:linear-gradient(150deg,#5a5566,#3d3946); }
  .thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .thumb .spin{ width:26px; height:26px; border:3px solid rgba(255,255,255,.34); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .thumb .retry{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:#fff; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.42); padding:6px 12px; border-radius:9px; }
  .thumb .scrim{ position:absolute; left:0; right:0; bottom:0; height:44%; background:linear-gradient(to top,rgba(0,0,0,.46),transparent); pointer-events:none; }
  .thumb .pbadge{ position:absolute; bottom:9px; left:9px; display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; padding:3px 9px 3px 8px; border-radius:999px; color:#fff; background:rgba(0,0,0,.34); }
  .thumb .imgbtn{ position:absolute; top:9px; right:9px; display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:#fff; background:rgba(0,0,0,.42); padding:5px 9px; border-radius:9px; }
  .card .body{ padding:11px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card .note{ font-size:13.5px; font-weight:500; line-height:1.36; word-break:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .cardtags{ display:flex; flex-wrap:wrap; gap:5px; }
  .card .ct{ font-size:10.5px; font-weight:500; padding:2px 8px; border-radius:999px; background:var(--violet-soft); color:var(--violet-ink); }
  .card .cardfoot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:3px; }
  .card .date{ font-size:11px; color:var(--muted); }
  .card .del{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:9px; color:#AC4A4A; font-size:14px; border:1px solid var(--line); background:#fff; }
  .card .del:active{ background:#FCEDED; border-color:#f0c9c9; }

  .empty-state{ text-align:center; padding:52px 22px; border:1.5px dashed var(--line); border-radius:20px; background:#fff; grid-column:1/-1; }
  .empty-state .glyph{ font-size:32px; margin-bottom:10px; }
  .empty-state .big{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:18px; margin:0 0 8px; }
  .empty-state p{ color:var(--muted); margin:0; font-size:13.5px; }

  .pv-ov{ position:fixed; inset:0; background:rgba(20,16,30,.74); display:none; align-items:center; justify-content:center; padding:16px; z-index:90; }
  .pv-ov.show{ display:flex; }
  .pv-box{ background:#111; border-radius:18px; overflow:hidden; width:min(380px,94vw); max-height:92vh; display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,.5); }
  .pv-head{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; color:#fff; font-size:13px; font-weight:600; }
  .pv-head button{ color:#fff; font-size:15px; padding:4px 9px; border-radius:8px; }
  .pv-head button:active{ background:rgba(255,255,255,.15); }
  .pv-body{ background:#000; flex:1; overflow:auto; display:flex; justify-content:center; -webkit-overflow-scrolling:touch; }
  .pv-body iframe{ width:100%; border:0; display:block; background:#fff; }
  .pv-yt{ position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  .pv-yt iframe{ position:absolute; inset:0; width:100%; height:100%; }
  .pv-open{ display:block; text-align:center; color:#fff; background:rgba(255,255,255,.12); padding:12px; font-size:13.5px; font-weight:600; text-decoration:none; }
  .pv-open:active{ background:rgba(255,255,255,.22); }

  .auth-ov{ position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; padding:24px; z-index:100; }
  .auth-ov.show{ display:flex; }
  .auth-card{ width:100%; max-width:360px; text-align:center; }
  .auth-logo{ width:60px; height:60px; margin:0 auto 14px; border-radius:16px; background:linear-gradient(150deg,#6B3FE4,#582dce); display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 10px 26px rgba(107,63,228,.4); }
  .auth-card h2{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:26px; letter-spacing:-.02em; margin:0 0 4px; }
  .auth-sub{ color:var(--muted); font-size:14px; margin:0 0 24px; }
  .auth-card input{ width:100%; font-size:15px; padding:14px 15px; border:1px solid var(--line); border-radius:13px; background:var(--surface); margin-bottom:10px; }
  .auth-btn{ width:100%; background:var(--violet); color:#fff; font-weight:600; font-size:15px; padding:14px; border-radius:13px; margin-top:6px; }
  .auth-btn:active{ background:var(--violet-ink); }
  .auth-btn:disabled{ opacity:.5; }
  .auth-err{ color:#B04A4A; font-size:13px; min-height:18px; margin:12px 0 0; }

  @media (min-width:820px){
    .wrap{ padding:30px 24px 60px; }
    .brand h1{ font-size:32px; } .brand .meta{ font-size:13px; }
    .quickadd{ padding:18px; }
    .catlist{ display:flex; flex-wrap:wrap; overflow:visible; }
    .grid{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; }
    .thumb{ aspect-ratio:4/5; }
    .thumb .imgbtn{ opacity:0; transition:opacity .14s ease; }
    .card:hover .thumb .imgbtn{ opacity:1; }
    .card{ transition:transform .14s ease, box-shadow .14s ease; }
    .card:hover{ transform:translateY(-3px); box-shadow:0 2px 4px rgba(25,22,34,.05),0 16px 36px rgba(25,22,34,.11); }
    .card .ct{ cursor:pointer; }
  }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } .thumb .spin{ animation:spin 1s linear infinite!important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Kho ý tưởng<span class="dot">.</span></h1>
      <p class="meta"><span id="totalCount">0 clip</span><span class="dotsep"></span><span id="syncState">Đang kết nối…</span></p>
    </div>
    <button class="btn-signout" id="signOutBtn" style="display:none">Đăng xuất</button>
  </header>

  <div id="notice" class="notice"></div>

  <section class="quickadd">
    <div class="qa-row">
      <button class="qa-paste" id="pasteBtn">📋 Dán</button>
      <input class="qa-input" id="link" placeholder="Dán link TikTok / IG / YouTube…" inputmode="url" />
    </div>
    <input class="qa-input qa-note" id="note" placeholder="Ghi chú (tuỳ chọn) — VD: transition đẹp, hook mạnh…" />
    <div class="qa-lbl">Danh mục</div>
    <div class="qa-cats" id="qaCats"></div>
    <button class="qa-save" id="save" disabled>Lưu video</button>
  </section>

  <div class="browse-h"><span>↓ Kho của bạn</span><button id="fillAll" class="fill-all">🔄 Lấy ảnh còn thiếu</button></div>
  <div class="catbar"><nav class="catlist" id="catList"></nav></div>
  <div class="content-h"><h2 id="catTitle">Tất cả <span class="sub" id="catSub"></span></h2></div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input type="text" id="searchInput" placeholder="Tìm trong mục này…" />
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="pv-ov" id="pvOv">
  <div class="pv-box">
    <div class="pv-head"><span id="pvTitle">Xem trước</span><button id="pvClose" aria-label="Đóng">✕</button></div>
    <div class="pv-body" id="pvBody"></div>
    <a class="pv-open" id="pvOpen" target="_blank" rel="noopener">Mở bản gốc ↗</a>
  </div>
</div>

<div class="auth-ov show" id="authOv">
  <div class="auth-card">
    <div class="auth-logo">🔖</div>
    <h2>Kho ý tưởng</h2>
    <p class="auth-sub">Đăng nhập để mở kho của bạn</p>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="username" />
    <input type="password" id="authPass" placeholder="Mật khẩu" autocomplete="current-password" />
    <button class="auth-btn" id="authBtn">Đăng nhập</button>
    <p class="auth-err" id="authErr"></p>
  </div>
</div>

<script src="./config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = window.SUPABASE_URL || "";
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "";
const CATEGORIES = ["📖 Storytelling","🎵 Âm thanh","💡 Ý tưởng","💅 Nail","🧑‍💻 Edit style","⭐️ Aesthetic","🧑‍🎨 Design project","👩🏻‍🎨 Design edit","🍰 Food/drink","🕺 Short content","🤣 Funny content","⚡️ Giống luôn","🧑‍🍳 Nấu ăn"];
const UNTAGGED = "__untagged__";
const configured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
const sb = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let videos = [];
let picked = new Set();
let activeCat = "all";
let searchTerm = "";
const fetching = new Set();

const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; };
function detectPlatform(u){ u=(u||"").toLowerCase(); if(u.includes("tiktok"))return"tiktok"; if(u.includes("instagram"))return"instagram"; if(u.includes("facebook")||u.includes("fb.watch")||u.includes("fb.com"))return"facebook"; if(u.includes("youtube")||u.includes("youtu.be"))return"youtube"; return"other"; }
const PLABEL={tiktok:"TikTok",instagram:"Instagram",facebook:"Facebook",youtube:"YouTube",other:"Link"};
const pMark=p=>p==="tiktok"?"♪":p==="instagram"?"◎":p==="facebook"?"f":p==="youtube"?"▶":"🔗";
const fmtDate=ts=>new Date(ts).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});
function ytId(url){ const m=(url||"").match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{6,})/); return m?m[1]:null; }
function thumbSrc(v){ if(v.thumb)return v.thumb; if(v.platform==="youtube"){ const id=ytId(v.url); if(id)return"https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"; } return null; }

function embedInfo(v){
  const url=v.url||"";
  if(v.platform==="youtube"){ const id=ytId(url); return id?{src:"https://www.youtube.com/embed/"+id, yt:true}:null; }
  if(v.platform==="tiktok"){ const m=url.match(/\/video\/(\d+)/); return m?{src:"https://www.tiktok.com/embed/v2/"+m[1], h:600}:null; }
  if(v.platform==="instagram"){ const m=url.match(/instagram\.com\/(reels?|p|tv)\/([A-Za-z0-9_-]+)/); if(m){ const type=m[1].indexOf("reel")===0?"reel":m[1]; return {src:"https://www.instagram.com/"+type+"/"+m[2]+"/embed", h:660}; } return null; }
  if(v.platform==="facebook"){ return {src:"https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(url)+"&show_text=false", h:420}; }
  return null;
}
function openPreview(v){
  const e=embedInfo(v); $("pvOpen").href=v.url;
  if(!e){ window.open(v.url,"_blank","noopener"); return; }
  $("pvTitle").textContent=PLABEL[v.platform]||"Xem trước";
  const body=$("pvBody");
  if(e.yt){ body.innerHTML='<div class="pv-yt"><iframe src="'+esc(e.src)+'" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>'; }
  else { body.innerHTML='<iframe src="'+esc(e.src)+'" style="height:'+e.h+'px" scrolling="no" allowfullscreen></iframe>'; }
  $("pvOv").classList.add("show");
}
function closePreview(){ $("pvOv").classList.remove("show"); $("pvBody").innerHTML=""; }

async function reload(){
  if(!configured){ showNotice(); return; }
  try{
    const { data, error } = await sb.from("videos").select("*").order("created_at",{ascending:false});
    if(error) throw error;
    videos = data || [];
    $("syncState").innerHTML='<span class="synced">● Đã đồng bộ</span>';
    render();
  }catch(e){ $("syncState").textContent="Lỗi kết nối"; console.error(e); showNotice("Không đọc được dữ liệu. Kiểm tra URL/anon key và bảng videos."); }
}
async function addVideo(v){ const { data, error } = await sb.from("videos").insert(v).select().single(); if(error){ alert("Lưu thất bại: "+error.message); return null; } return data; }
async function removeVideo(id){ const { error } = await sb.from("videos").delete().eq("id",id); if(error)console.error(error); }
async function patchThumb(id,thumb){ const { error } = await sb.from("videos").update({thumb}).eq("id",id); if(error)console.error(error); }
function showNotice(msg){ const n=$("notice"); n.style.display="block"; n.innerHTML=msg||'<b>Chưa kết nối Supabase.</b> Dán URL + anon key vào config.js rồi tải lên lại.'; $("syncState").textContent="Chưa cấu hình"; }

async function fetchOg(url){ try{ const c=new AbortController(),t=setTimeout(()=>c.abort(),8000); const r=await fetch("https://api.microlink.io/?url="+encodeURIComponent(url),{signal:c.signal}); clearTimeout(t); if(r.ok){ const j=await r.json(); const i=j&&j.data&&j.data.image&&j.data.image.url; if(i)return i; } }catch(e){} return null; }
async function fetchTT(url){ try{ const c=new AbortController(),t=setTimeout(()=>c.abort(),5000); const r=await fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(url),{signal:c.signal}); clearTimeout(t); if(r.ok){ const j=await r.json(); if(j.thumbnail_url)return j.thumbnail_url; } }catch(e){} return null; }
async function fetchNoembed(url){ try{ const c=new AbortController(),t=setTimeout(()=>c.abort(),7000); const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent(url),{signal:c.signal}); clearTimeout(t); if(r.ok){ const j=await r.json(); if(j&&j.thumbnail_url)return j.thumbnail_url; } }catch(e){} return null; }
async function autoThumb(url,platform){ if(platform==="youtube"){ const id=ytId(url); if(id)return"https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"; } const ne=await fetchNoembed(url); if(ne)return ne; if(platform==="tiktok"){ const tt=await fetchTT(url); if(tt)return tt; } const og=await fetchOg(url); if(og)return og; return null; }
async function runAutoThumb(id){ const v=videos.find(x=>x.id===id); if(!v||fetching.has(id))return; fetching.add(id); render(); const img=await autoThumb(v.url,v.platform); fetching.delete(id); if(img){ v.thumb=img; await patchThumb(id,img); } render(); }
const attempted=new Set();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let filling=false;
async function autoFillThumbs(){
  if(filling)return; filling=true;
  const btn=$("fillAll"); if(btn){ btn.disabled=true; btn.textContent="Đang lấy ảnh…"; }
  let metaBudget=8;
  for(const v of videos){
    if(v.thumb||attempted.has(v.id)||fetching.has(v.id))continue;
    if(v.platform==="youtube")continue;
    if(v.platform==="instagram"||v.platform==="facebook"||v.platform==="other"){ if(metaBudget<=0)continue; metaBudget--; }
    attempted.add(v.id);
    await runAutoThumb(v.id);
    await sleep(700);
  }
  if(btn){ btn.disabled=false; btn.textContent="🔄 Lấy ảnh còn thiếu"; }
  filling=false;
}

function downscale(file,maxW=480,q=0.72){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,maxW/im.width),w=Math.round(im.width*s),h=Math.round(im.height*s); const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h); res(c.toDataURL("image/jpeg",q)); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
function pickImage(cb){ const i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.onchange=async()=>{ const f=i.files&&i.files[0]; if(!f)return; try{ cb(await downscale(f)); }catch(e){ alert("Không đọc được ảnh."); } }; i.click(); }

const linkInput=$("link"), saveBtn=$("save");
function updateSave(){ saveBtn.disabled = linkInput.value.trim()===""; }
linkInput.addEventListener("input",updateSave);
$("pasteBtn").onclick=async()=>{ try{ const t=await navigator.clipboard.readText(); if(t){ linkInput.value=t.trim(); updateSave(); } }catch(e){ alert("Trình duyệt không cho đọc clipboard. Hãy dán tay vào ô link."); } };

const qaCats=$("qaCats");
function renderQaCats(){ qaCats.innerHTML=""; CATEGORIES.forEach(c=>{ const b=document.createElement("button"); b.className="qa-chip"+(picked.has(c)?" on":""); b.textContent=c; b.onclick=()=>{ picked.has(c)?picked.delete(c):picked.add(c); renderQaCats(); }; qaCats.appendChild(b); }); }

saveBtn.onclick=async()=>{
  const url=linkInput.value.trim(); if(!url||!configured)return;
  const platform=detectPlatform(url);
  const payload={ url, note:$("note").value.trim(), platform, categories:Array.from(picked), thumb:null };
  saveBtn.disabled=true; saveBtn.textContent="Đang lưu…";
  const row=await addVideo(payload);
  saveBtn.textContent="Lưu video";
  if(row){ videos.unshift(row); linkInput.value=""; $("note").value=""; picked.clear(); renderQaCats(); activeCat="all"; render(); runAutoThumb(row.id); }
  else saveBtn.disabled=false;
};
linkInput.addEventListener("keydown",e=>{ if(e.key==="Enter")saveBtn.click(); });
$("note").addEventListener("keydown",e=>{ if(e.key==="Enter")saveBtn.click(); });

const catList=$("catList");
function countFor(c){ if(c==="all")return videos.length; if(c===UNTAGGED)return videos.filter(v=>!v.categories||!v.categories.length).length; return videos.filter(v=>v.categories&&v.categories.includes(c)).length; }
function renderCats(){ catList.innerHTML="";
  const mk=(label,val)=>{ const b=document.createElement("button"); b.className="cat"+(activeCat===val?" on":""); b.innerHTML='<span>'+esc(label)+'</span><span class="n">'+countFor(val)+'</span>'; b.onclick=()=>{ activeCat=val; searchTerm=""; $("searchInput").value=""; render(); }; return b; };
  catList.appendChild(mk("Tất cả","all"));
  CATEGORIES.forEach(t=>catList.appendChild(mk(t,t)));
  if(countFor(UNTAGGED)>0) catList.appendChild(mk("Chưa phân loại",UNTAGGED));
}
$("searchInput").addEventListener("input",e=>{ searchTerm=e.target.value.toLowerCase(); renderGrid(); });
function visible(){ return videos.filter(v=>{ let ok; if(activeCat==="all")ok=true; else if(activeCat===UNTAGGED)ok=!v.categories||!v.categories.length; else ok=v.categories&&v.categories.includes(activeCat); const s=!searchTerm||(v.note||"").toLowerCase().includes(searchTerm)||(v.url||"").toLowerCase().includes(searchTerm); return ok&&s; }); }

const grid=$("grid"), catTitle=$("catTitle"), catSub=$("catSub"), totalCount=$("totalCount");
function renderGrid(){
  const list=visible();
  catTitle.childNodes[0].nodeValue=(activeCat==="all"?"Tất cả":activeCat===UNTAGGED?"Chưa phân loại":activeCat)+" ";
  catSub.textContent=list.length+" video"; totalCount.textContent=videos.length+" clip";
  grid.innerHTML="";
  if(!configured){ grid.innerHTML='<div class="empty-state"><div class="glyph">🔌</div><p class="big">Chưa kết nối Supabase</p><p>Xem khung vàng phía trên.</p></div>'; return; }
  if(videos.length===0){ grid.innerHTML='<div class="empty-state"><div class="glyph">🎬</div><p class="big">Kho còn trống</p><p>Dán link ở ô trên để lưu clip đầu tiên.</p></div>'; return; }
  if(list.length===0){ grid.innerHTML='<div class="empty-state"><div class="glyph">🔍</div><p class="big">Mục này chưa có video</p><p>Lưu clip mới và gắn vào danh mục này.</p></div>'; return; }
  list.forEach(v=>{
    const src=thumbSrc(v), hasThumb=!!v.thumb, isFetching=fetching.has(v.id);
    let phInner;
    if(isFetching) phInner='<div class="spin"></div><span class="cap">Đang lấy ảnh…</span>';
    else if(v.platform==="instagram"||v.platform==="facebook") phInner='<span class="big">'+pMark(v.platform)+'</span><button class="retry" data-img="'+v.id+'">🖼 Thêm ảnh</button>';
    else phInner='<span class="big">'+pMark(v.platform)+'</span><button class="retry" data-fetch="'+v.id+'">🔄 Lấy ảnh</button>';
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=
      '<div class="thumb" data-id="'+v.id+'" title="Xem trước trong app">'+
        '<div class="ph '+v.platform+'">'+phInner+'</div>'+
        (src?'<img src="'+esc(src)+'" alt="" onerror="this.remove()">':'')+
        '<div class="scrim"></div>'+
        '<span class="pbadge">'+pMark(v.platform)+' '+PLABEL[v.platform]+'</span>'+
        '<button class="imgbtn" data-img="'+v.id+'">🖼 '+(hasThumb?'Đổi':'Ảnh')+'</button>'+
      '</div>'+
      '<div class="body">'+
        (v.note?'<div class="note">'+esc(v.note)+'</div>':'')+
        ((v.categories&&v.categories.length)?'<div class="cardtags">'+v.categories.map(t=>'<span class="ct" data-tag="'+esc(t)+'">'+esc(t)+'</span>').join('')+'</div>':'')+
        '<div class="cardfoot"><span class="date">'+fmtDate(v.created_at)+'</span><button class="del" data-del="'+v.id+'" title="Xoá">🗑</button></div>'+
      '</div>';
    grid.appendChild(c);
  });
  grid.querySelectorAll(".thumb").forEach(t=>t.onclick=e=>{ if(e.target.closest("[data-img]")||e.target.closest("[data-fetch]"))return; const v=videos.find(x=>x.id===t.getAttribute("data-id")); if(v)openPreview(v); });
  grid.querySelectorAll("[data-fetch]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); runAutoThumb(b.getAttribute("data-fetch")); });
  grid.querySelectorAll("[data-img]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const id=b.getAttribute("data-img"); pickImage(async d=>{ const v=videos.find(x=>x.id===id); if(v){ v.thumb=d; await patchThumb(id,d); render(); } }); });
  grid.querySelectorAll("[data-del]").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const id=b.getAttribute("data-del"); videos=videos.filter(x=>x.id!==id); render(); await removeVideo(id); });
  grid.querySelectorAll(".ct").forEach(c=>c.onclick=e=>{ e.stopPropagation(); activeCat=c.getAttribute("data-tag"); searchTerm=""; $("searchInput").value=""; render(); });
}
function render(){ renderCats(); renderGrid(); }

function subscribe(){ if(!configured)return; let t=null; sb.channel("videos-changes").on("postgres_changes",{event:"*",schema:"public",table:"videos"},()=>{ clearTimeout(t); t=setTimeout(reload,300); }).subscribe(); }

function extractUrl(s){ if(!s)return""; const m=s.match(/https?:\/\/[^\s]+/); return m?m[0]:s.trim(); }
function handleShareTarget(){ const p=new URLSearchParams(location.search); const shared=p.get("url")||p.get("text")||p.get("title"); if(shared){ const link=extractUrl(shared); if(link){ linkInput.value=link; updateSave(); linkInput.scrollIntoView({block:"start"}); linkInput.focus(); } history.replaceState(null,"",location.pathname); } }
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
$("pvClose").onclick=closePreview;
$("pvOv").addEventListener("click",e=>{ if(e.target===$("pvOv"))closePreview(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("pvOv").classList.contains("show"))closePreview(); });
$("fillAll").onclick=()=>{ videos.forEach(v=>{ if(!v.thumb)attempted.delete(v.id); }); autoFillThumbs(); };

const authOv=$("authOv"), authEmail=$("authEmail"), authPass=$("authPass"), authBtn=$("authBtn"), authErr=$("authErr"), signOutBtn=$("signOutBtn");
let subscribed=false;
function showAuth(){ authOv.classList.add("show"); signOutBtn.style.display="none"; }
function hideAuth(){ authOv.classList.remove("show"); }
async function onSignedIn(){ hideAuth(); signOutBtn.style.display=""; await reload(); if(!subscribed){ subscribe(); subscribed=true; } autoFillThumbs(); }
authBtn.onclick=async()=>{ const email=authEmail.value.trim(), password=authPass.value; if(!email||!password)return; authBtn.disabled=true; authBtn.textContent="Đang đăng nhập…"; authErr.textContent=""; const { error }=await sb.auth.signInWithPassword({ email, password }); authBtn.disabled=false; authBtn.textContent="Đăng nhập"; if(error) authErr.textContent="Sai email hoặc mật khẩu. Thử lại nhé."; };
authPass.addEventListener("keydown",e=>{ if(e.key==="Enter")authBtn.click(); });
signOutBtn.onclick=async()=>{ await sb.auth.signOut(); videos=[]; render(); showAuth(); };

renderQaCats(); render(); handleShareTarget();
(async function(){
  if(!configured){ hideAuth(); showNotice(); return; }
  const { data:{ session } }=await sb.auth.getSession();
  if(session) onSignedIn(); else showAuth();
  sb.auth.onAuthStateChange((_evt, sess)=>{ if(sess) onSignedIn(); else showAuth(); });
})();
</script>
